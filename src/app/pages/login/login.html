<div class="login-page">

  <div class="brand">
    <img
      src="/logo-mediflow.png"
      alt="Logo MediFlow"
      class="brand-logo"
    >
  </div>

  <div class="login-card">

    <div class="user-icon">
      <span>👤</span>
    </div>

    <h1>Connexion</h1>

    <p class="subtitle">
      Veuillez vous connecter à votre compte
    </p>

    <form (ngSubmit)="connexion()">

      <div class="form-group">
        <label for="email">Email</label>

        <div class="input-wrapper">
          <span class="input-icon">✉</span>

        <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="votre.email@exemple.com"
        >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>

        <div class="input-wrapper">
          <span class="input-icon">🔒</span>

        <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="motDePasse"
            placeholder="Votre mot de passe"
        >

          <button
            type="button"
            class="password-toggle"
          >
            👁
          </button>
        </div>
      </div>

      <div class="forgot-password">
        <a href="#">
          Mot de passe oublié ?
        </a>
      </div>

      <button
        type="submit"
        class="login-button"
      >
        <span>⇥</span>
        Se connecter
      </button>

    </form>

  </div>

</div>
